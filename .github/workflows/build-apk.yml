name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Kamera ruxsatini AndroidManifest ga qo'shish
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          grep -n 'CAMERA\|camera' "$M"

      - name: Generate app icons (ixtiyoriy)
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#10131f' --splashBackgroundColor '#10131f'

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rubik-kubiklari-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
