<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubik kubiklari</title>
<style>
:root{--bg:#10131f;--bg2:#2c3558;--fg:#eef1fb;--mut:#b9c1e0;--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.2);--pri:#4c6fff;--pnl:rgba(12,15,28,.78)}
@media(prefers-color-scheme:light){:root{--bg:#d9dff2;--bg2:#fbfcff;--fg:#1a2036;--mut:#4b5578;--card:rgba(20,30,70,.07);--bd:rgba(20,30,70,.22);--pnl:rgba(255,255,255,.88)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;color-scheme:light dark;background:radial-gradient(ellipse at 50% 35%,var(--bg2) 0,var(--bg) 70%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;padding-top:env(safe-area-inset-top,0)}
header{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 12px}
header h1{margin:0;font-size:18px;font-weight:650}
#stage{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:2px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none}
#hud button{pointer-events:auto;height:34px}
#time{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.mcn{font-size:15px;color:var(--mut)}
#raceBar{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(280px,70vw);display:none;font-size:13px;color:var(--fg)}
#raceBar div{display:flex;align-items:center;gap:8px;margin:3px 0}
#raceBar span{width:28px}
#raceBar i{display:block;height:8px;border-radius:4px;background:#2fbf71;transition:width .25s}
#raceBar i.ai{background:#ff6a13}
#map{position:absolute;top:84px;pointer-events:none;border-radius:10px;background:var(--pnl);padding:4px}
.pill{position:absolute;left:50%;top:104px;transform:translate(-50%,-10px);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s;z-index:5;font-weight:650}
#toast{background:#2fbf71;color:#08210f}
#hint{background:var(--pnl);color:var(--fg);border:1px solid var(--bd)}
.pill.show{opacity:1;transform:translate(-50%,0)}
#ui{padding:6px 12px calc(10px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
button,select,.tx{font:inherit;font-size:14px;height:40px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 14px;cursor:pointer}
select option{background:#1b2036;color:#eef1fb}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.97)}
button.p{background:var(--pri);border-color:#6d8aff;color:#fff}
#tabs{display:flex;gap:6px}
#tabs button{height:36px;border-radius:999px}
#tabs button.on{background:var(--pri);color:#fff;border-color:transparent}
.pn{display:none;width:100%;max-width:660px;max-height:30vh;overflow-y:auto;background:var(--pnl);border:1px solid var(--bd);border-radius:14px;padding:10px}
.mv button{height:38px;min-width:44px;padding:0 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}
.grid label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.grid select{width:130px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--card);border:1px solid var(--bd);position:relative;cursor:pointer;flex:none;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:left .15s}
input[type=checkbox]:checked{background:var(--pri)}
input[type=checkbox]:checked::after{left:20px;background:#fff}
.tx{width:min(260px,100%);cursor:text}
details summary{cursor:pointer;color:var(--mut);font-size:14px;margin:8px 0 4px}
#info{font-size:13px;line-height:1.6;font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:8px}
@media(max-width:560px){button,select,.tx{height:44px}}
/* ===== moslashuvchan tartib (turli telefonlar uchun) ===== */
:root{--bh:40px;--hud:46px;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
html,body{height:100vh;height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding-left:var(--sl);padding-right:var(--sr)}
button,select,.tx{height:var(--bh);touch-action:manipulation}
@media(pointer:coarse){:root{--bh:44px}input,select,.tx{font-size:16px}}
header{padding:6px 10px}
header select{max-width:60vw}
#hud{flex-wrap:wrap;gap:2px 10px;padding:0 8px}
#time{font-size:clamp(26px,8vw,38px);min-width:0}
#raceBar{top:calc(var(--hud) + 2px)}
#map{top:calc(var(--hud) + 48px)}
.pill{top:calc(var(--hud) + 58px);max-width:92vw;text-align:center}
#ui{width:100%;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
#ui>.row:first-child{width:100%;max-width:660px;flex-wrap:nowrap;gap:6px}
#ui>.row:first-child>button{flex:1 1 0;min-width:0;padding:0 2px;font-size:clamp(11px,3.1vw,14px);line-height:1.1;overflow:hidden}
#ui>.row:first-child>#bSh,#ui>.row:first-child>#bRe{flex-grow:1.35}
#ui>.row:first-child>#bUn,#ui>.row:first-child>#bSo{flex-grow:.8}
#tabs button{height:max(36px,calc(var(--bh) - 4px))}
.mv button{height:calc(var(--bh) - 2px)}
.pn{max-height:30vh;max-height:min(32dvh,300px)}
.tx{flex:1 1 140px;width:auto;min-width:0;max-width:100%}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
@media(max-height:700px){header{padding:3px 10px}header h1{font-size:15px}#ui{gap:4px}}
@media(max-width:360px){button{font-size:13px}.grid label{font-size:13px}.grid select{width:110px}}
@media(max-width:340px){header h1{display:none}}
@media(orientation:landscape) and (max-height:520px){
 body{display:grid;grid-template-columns:minmax(0,1fr) clamp(270px,42vw,420px);grid-template-rows:auto minmax(0,1fr)}
 #stage{grid-column:1;grid-row:1/-1}
 header{grid-column:2;grid-row:1;padding:2px 8px;flex-wrap:wrap}
 #ui{grid-column:2;grid-row:2;overflow-y:auto;justify-content:flex-start;align-items:center;padding-top:2px}
 .pn{max-height:none;overflow:visible}
 #time{font-size:clamp(22px,7vh,32px)}
}
@media(min-width:900px) and (min-height:700px){#ui{max-width:760px;margin:0 auto}}

/* ===== yangi: yurish tugmalarini yashirish, qadamlab yechish paneli, kattalashtirish ===== */
body.nomv #mv,body.nomv #mv2{display:none}
#bZr{height:34px}
#stp{display:none;width:100%;max-width:660px;flex-direction:column;gap:6px;background:var(--pnl);border:1px solid var(--bd);border-radius:14px;padding:8px 10px}
#stp.on{display:flex}
#stp .top{display:flex;gap:10px;align-items:center}
#sinfo{flex:1;font-size:14px;line-height:1.4}
#schips{position:relative;display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
#schips .c2{flex:none;padding:3px 9px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-weight:600;font-size:14px}
#schips .c2.done{opacity:.45}
#schips .c2.cur{background:var(--pri);color:#fff;border-color:transparent}
#stp .row{gap:6px;flex-wrap:nowrap}#stp .row button{min-width:0;padding:0 10px;flex:none}
#sCnt{min-width:54px;text-align:center;font-variant-numeric:tabular-nums}

/* ===== toza ekran: 3 tur — faqat vaqt (mt), faqat kubik (mc), kubik + vaqt (mb) ===== */
#bClean{width:44px;min-width:0;padding:0;border-radius:999px;height:max(36px,calc(var(--bh) - 4px))}
#bExit,#bMode{display:none;position:absolute;top:6px;z-index:4;height:36px;opacity:.6;padding:0 12px}
#bExit{right:8px}#bMode{left:8px}
#cleanHint,#bLap,#laps{display:none}
body.clean header,body.clean #ui,body.clean #map,body.clean #raceBar,body.clean .mcn,body.clean #bZr,body.clean #toast,body.clean #hint{display:none!important}
body.clean{display:flex!important;flex-direction:column}
body.clean #stage{grid-column:auto;grid-row:auto}
body.clean #bExit,body.clean #bMode{display:block}
body.clean.mt #cv{display:none}
body.clean.mt #hud{top:7%;transform:none;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px 10px;padding:0 12px;bottom:auto}
body.clean.mt #time{flex:0 0 100%;text-align:center;font-size:clamp(56px,22vw,150px);pointer-events:auto;cursor:pointer;-webkit-user-select:none}
body.clean.mt #bTm,body.clean.mt #bLap{display:block;height:58px;font-size:18px;padding:0 24px;border-radius:14px}
body.clean.mt #bLap:disabled{opacity:.4}
body.clean.mt #cleanHint{display:block;flex:0 0 100%;text-align:center}
body.clean.mt #laps{display:block;flex:0 0 100%;max-width:420px;max-height:34vh;overflow-y:auto;touch-action:pan-y;pointer-events:auto;background:var(--pnl);border:1px solid var(--bd);border-radius:12px}
body.clean.mt #laps:empty{display:none}
#laps .lp{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums;font-size:17px}
#laps .lp:last-child{border-bottom:0}
body.clean.mc #hud{display:none}
body.clean.mb #hud{top:2px;transform:none}
body.clean.mb #time{font-size:clamp(30px,10vw,56px)}
body.clean.mb #bTm{height:40px;font-size:15px;padding:0 14px}

/* ===== chap/o'ng qo'l, skramble ===== */
body.hand-l #ui>.row:first-child,body.hand-l #trow,body.hand-l #tabs,body.hand-l .mv,body.hand-l #stp .row{flex-direction:row-reverse}
body.hand-l #bExit{right:auto;left:8px}body.hand-l #bMode{left:auto;right:8px}
#scrBar{display:none;flex:0 0 100%;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
#scrTxt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5;white-space:pre-line;text-align:center;max-height:20vh;overflow-y:auto;touch-action:pan-y;word-break:break-word;background:var(--pnl);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;-webkit-user-select:text;user-select:text}
#bScr2{height:40px;flex:none;padding:0 12px}
body.clean.mt:not(.noscr) #scrBar,body.clean.mb:not(.noscr) #scrBar{display:flex}
body.clean.mt #scrBar{order:-1}
body.clean.mb #scrBar{order:9}
body.clean.mb #scrTxt{font-size:13px;max-height:16vh}
body.clean.mt #hud{top:52px}
body.clean.mb #hud{top:46px}
</style>
</head>
<body>
<header><h1>Rubik kubiklari</h1><select id="sel"></select><a href="yechuvchi.html" style="color:var(--mut);font-size:14px;text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:10px 12px">Yechuvchi ›</a></header>
<div id="stage"><canvas id="cv"></canvas><canvas id="map"></canvas>
<div id="hud"><div id="scrBar"><span id="scrTxt"></span><button id="bScr2" title="Yangi skramble">🎲</button></div><span class="mcn">Yurishlar: <b id="mc">0</b></span><span id="time">0:00.0</span><button id="bTm">⏱ Boshlash</button><button id="bZr" hidden title="Kattalashtirishni tiklash">⤢ 1×</button><button id="bLap" disabled>📍 Belgilash</button><small id="cleanHint">Vaqtni bosing — start/stop · ikki marta bosing — nolga · «Belgilash» — shu vaqtni yozib qo'yadi</small><div id="laps"></div></div>
<button id="bExit" title="Toza ekrandan chiqish">✕ Chiqish</button><button id="bMode" title="Toza ekran turini almashtirish">⇄</button><div id="raceBar"></div><div id="toast" class="pill">Tabriklaymiz! Yechildi 🎉</div><div id="hint" class="pill"></div></div>
<div id="ui">
<div class="row"><button class="p" id="bSh">Aralashtirish</button><button id="bUn">Orqaga</button><button id="bSo">Yechish</button><button id="bRe">Boshlang'ich holat</button></div>
<div id="stp"><div class="top"><div id="sdg"></div><div id="sinfo"></div></div><div id="schips"></div><div class="row"><button id="sFirst" aria-label="Boshiga">⏮</button><button id="sPrev" aria-label="Oldingi">◀</button><b id="sCnt"></b><button id="sNext" class="p">Keyingi ▶</button><button id="sAuto">▶ Avto</button><button id="sX" aria-label="Yopish">✕</button></div></div>
<div class="row" id="trow" style="gap:6px;flex-wrap:nowrap"><div id="tabs"><button data-p="t1" class="on">Yurishlar</button><button data-p="t2">Sozlamalar</button><button data-p="t3">Statistika</button></div><button id="bClean" title="Ekranni tozalash: faqat vaqt" aria-label="Toza ekran">🧹</button></div>
<div class="pn" id="t1" style="display:block">
<div class="row mv" id="mv"></div>
<details id="more"><summary id="moreS">Qo'shimcha (M E S, x y z)</summary><div class="row mv" id="mv2"></div><div class="row mv"><button id="bX">x</button><button id="bY">y</button><button id="bZ">z</button></div></details>
<div class="row" style="margin-top:8px"><input id="seq" class="tx" placeholder="Yurishlar yoki kod: R U R' F2"><button id="bRun">Bajarish</button><button id="bHint">Maslahat</button><button id="bCopy">Kodni nusxalash</button></div>
</div>
<div class="pn" id="t2"><div class="grid">
<label>Yechish tezligi <select id="spd"><option value="700">Juda sekin</option><option value="350">Sekin</option><option value="150" selected>O'rta</option><option value="45">Tez</option></select></label>
<label>Burilish tezligi <select id="ts"><option value="400">Sekin</option><option value="240" selected>O'rta</option><option value="110">Tez</option></select></label>
<label>Aralashtirish turi <select id="mode"><option value="f">To'liq</option><option value="r">Faqat R U F</option><option value="u">Faqat U qatlam</option></select></label>
<label>Rang mavzusi <select id="theme"></select></label>
<label>Xarita <input type="checkbox" id="mapOn"></label>
<label>Xarita joyi <select id="mapSide"><option value="r">O'ng</option><option value="l">Chap</option></select></label>
<label>15s tayyorgarlik <input type="checkbox" id="insp"></label>
<label>AI bilan poyga <input type="checkbox" id="race"></label>
<label>Tebranish <input type="checkbox" id="vib"></label>
<label>Ovoz <input type="checkbox" id="snd"></label>
<label>Yurish tugmalari (R R' L …) <input type="checkbox" id="showMv" checked></label>
<label>"Yechish" tugmasi <select id="solveMode"><option value="a">Avtomatik</option><option value="s">Qadamlab (formula + chizma)</option></select></label>
<label>Toza ekran tugmasi (🧹) <input type="checkbox" id="showClean" checked></label>
<label>Toza ekran rejimi (faqat vaqt) <input type="checkbox" id="cleanOn"></label>
<label>Toza ekran turi <select id="cleanMode"><option value="t">Faqat vaqt</option><option value="c">Faqat kubik</option><option value="b">Kubik + vaqt</option></select></label>
<label>Ikki barmoq bilan burish <input type="checkbox" id="twist2" checked></label>
<label>Ekran o'chmasin (wake lock) <input type="checkbox" id="wake"></label>
<label>Yurish ovozi turi <select id="sndType"><option value="click">Klik</option><option value="wood">Yog'och</option><option value="beep">Pik</option></select></label>
<label>Tugmalar joyi <select id="hand"><option value="r">O'ng qo'l</option><option value="l">Chap qo'l</option></select></label>
<label>Kubik terisi <select id="skin"><option value="k">Klassik (stikerli)</option><option value="s">Stikersiz</option><option value="b">Qora</option></select></label>
<label>Skramble ko'rsatilsin <input type="checkbox" id="showScr" checked></label>
</div></div>
<div class="pn" id="t3"><div id="info"></div><div class="row"><button id="bRes">Natijalar</button><button id="bAI">AI xotira</button></div>
<div class="row" style="margin-top:8px"><button id="bScr">🎲 Skramble</button><button id="bScrA">Kubikka qo'llash</button></div><div id="scrOut" style="font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-line;margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text"></div></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]),norm=a=>sc(a,1/len(a)),avg=p=>sc(p.reduce(add),1/p.length);
const mv=(M,v)=>[M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2],M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2],M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2]];
const mul=(A,B)=>A.map((_,i)=>[0,1,2].map(j=>A[i][0]*B[0][j]+A[i][1]*B[1][j]+A[i][2]*B[2][j]));
function rotMat(k,th){const c=Math.cos(th),s=Math.sin(th),t=1-c,[x,y,z]=k;return[[t*x*x+c,t*x*y-s*z,t*x*z+s*y],[t*x*y+s*z,t*y*y+c,t*y*z-s*x],[t*x*z-s*y,t*y*z+s*x,t*z*z+c]]}
const PAL=['#f4f4ef','#ffd500','#c8102e','#ff6a13','#009b48','#0046ad','#8e44ad','#9be564','#ff7eb6','#19c3d6','#8b5a2b','#9a9a9a'];
const E=[[1,0,0],[0,1,0],[0,0,1]];
const CF=[{n:[1,0,0],u:[0,0,-1],v:[0,1,0],p:[2,1],color:2},{n:[-1,0,0],u:[0,0,1],v:[0,1,0],p:[0,1],color:3},{n:[0,-1,0],u:[1,0,0],v:[0,0,1],p:[1,0],color:0},{n:[0,1,0],u:[1,0,0],v:[0,0,-1],p:[1,2],color:1},{n:[0,0,1],u:[1,0,0],v:[0,1,0],p:[1,1],color:4},{n:[0,0,-1],u:[-1,0,0],v:[0,1,0],p:[3,1],color:5}];
const bas=n=>{let w=[0,1,0];if(Math.abs(dot(n,w))>.99)w=[0,0,1];const v=norm(sub(w,sc(n,dot(w,n))));return{n,v,u:cross(v,n)}};

// ---------- jumboq turlari ----------
const KINDS=[];for(let n=2;n<=11;n++)KINDS.push(['c'+n,n+'×'+n]);KINDS.push(['pyr','Piramida (Pyraminx)'],['skw','Skewb'],['meg','Megaminx (12 yoqli)']);
function build(k){
 const slots=[],faces=[],moves=[],btn=[];
 const mk=(pts,f)=>slots.push({i:slots.length,pts,c:avg(pts),n:faces[f].n,face:f});
 let grid=[4,3],sh=20,step;
 if(k[0]==='c'){
  const N=+k.slice(1);step=Math.PI/2;sh=N===2?11:18+4*N;
  CF.forEach(f=>faces.push(f));
  faces.forEach((f,fi)=>{for(let i=0;i<N;i++)for(let j=0;j<N;j++){const a=i-N/2,b=j-N/2;mk([[a,b],[a+1,b],[a+1,b+1],[a,b+1]].map(q=>add(sc(f.n,N/2),add(sc(f.u,q[0]),sc(f.v,q[1])))),fi)}});
  const lay=(c,ax)=>Math.min(N-1,Math.max(0,Math.round(c[ax]+(N-1)/2)));
  for(let ax=0;ax<3;ax++)for(let l=0;l<N;l++)moves.push({a:E[ax],step,set:slots.map(s=>lay(s.c,ax)===l)});
  [['R',0,N-1,1],['L',0,0,-1],['U',1,0,-1],['D',1,N-1,1],['F',2,N-1,1],['B',2,0,-1]].forEach(([t,ax,l,d])=>{btn.push({t,m:ax*N+l,d});btn.push({t:t+"'",m:ax*N+l,d:-d})});
 }else if(k==='skw'){
  step=2*Math.PI/3;sh=14;CF.forEach(f=>faces.push(f));
  faces.forEach((f,fi)=>{const P=(x,y)=>add(f.n,add(sc(f.u,x),sc(f.v,y)));mk([P(-1,0),P(0,-1),P(1,0),P(0,1)],fi);[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([x,y])=>mk([P(x,y),P(x,0),P(0,y)],fi))});

// ---------- skramble generatori (tasodifiy yurishlar; jismoniy kubik uchun) ----------
function makeScramble(){
 const k=P.k,R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)];
 if(k[0]==='c'){const N=+k.slice(1),AX={U:1,D:1,R:0,L:0,F:2,B:2},fs=N===2?['U','R','F']:'URFDLB'.split('');
  const len=N===2?10:N===3?20:N<=7?[0,0,0,0,40,60,80,100][N]:100+(N-7)*20,out=[];let p1=null,p2=null;
  while(out.length<len){const f=pick(fs);if(f===p1||(p2&&AX[f]===AX[p1]&&AX[p1]===AX[p2]))continue;
   let t=f;if(N>=4){const kk=1+R(Math.floor(N/2));t=kk===1?f:kk===2?f+'w':kk+f+'w'}
   out.push(t+pick(['',"'",'2']));p2=p1;p1=f}
  return out.join(' ')}
 if(k==='pyr'||k==='skw'){const fs=k==='pyr'?'ULRB':'RLUB',n=k==='pyr'?11:9,out=[];let last='';
  while(out.length<n){const f=pick(fs.split(''));if(f===last)continue;last=f;out.push(f+(R(2)?"'":''))}
  if(k==='pyr')'ulrb'.split('').forEach(t=>{const r=R(3);if(r)out.push(t+(r===2?"'":''))});
  return out.join(' ')}
 if(k==='meg'){const lines=[];for(let l=0;l<7;l++){const a=[];for(let i=0;i<5;i++)a.push('R'+(R(2)?'++':'--'),'D'+(R(2)?'++':'--'));a.push(R(2)?'U':"U'");lines.push(a.join(' '))}return lines.join('\n')}
 return''}
function renderScr(){if(!SCR)SCR=makeScramble();$('scrTxt').textContent=SCR;$('scrOut').textContent=SCR}
function scrExpand(tok,N){const m=/^(\d*)([UDLRFB])(w?)(2|')?$/.exec(tok);if(!m)return[];
 const f=m[2],w=!!m[3],n=m[1]?+m[1]:(w?2:1),[ax,hi,fd]={R:[0,1,1],L:[0,0,-1],U:[1,0,-1],D:[1,1,1],F:[2,1,1],B:[2,0,-1]}[f],out=[],layers=[];
 if(w)for(let j=1;j<=n;j++)layers.push(j);else layers.push(n);
 const d=m[4]==="'"?-fd:fd,rp=m[4]==='2'?2:1;
 for(const j of layers){const l=hi?N-j:j-1;for(let r=0;r<rp;r++)out.push({m:P.moves[ax*N+l],d})}
 return out}
$('bScr').onclick=$('bScr2').onclick=()=>{SCR='';renderScr()};
$('bScrA').onclick=()=>{if(P.k[0]!=='c'){showHint("Qo'llash faqat kublar uchun",2500);return}
 run(async()=>{closeSteps();const N=P.moves.length/3;for(const t of SCR.split(/\s+/).filter(Boolean))for(const x of scrExpand(t,N)){await doMove(x.m,x.d,45);hist.push(x)}
  mc=0;$('mc').textContent=0;timerReset();scrStart()})};

$('bLap').onclick=()=>{if(tState!==1)return;LAPS.push(curMs());renderLaps();if($('vib').checked&&navigator.vibrate)navigator.vibrate(15);if($('snd').checked)beep()};

// ---------- qadamlab yechish: formula chiplari + yurish chizmasi + 3D da ajratish ----------
function mDiag(tok,N,px){N=N||3;px=px||72;
 const m=/^(\d*)([UDLRFB])(w?)(2|')?$|^([udlrfb])(2|')?$|^([MES])(2|')?$/.exec(tok);if(!m)return'';
 let L,n=1,w=false,suf;
 if(m[2]){L=m[2];w=!!m[3];n=m[1]?+m[1]:(w?2:1);suf=m[4]}else if(m[5]){L=m[5].toUpperCase();w=true;n=2;suf=m[6]}else{L=m[7];suf=m[8]}
 const dbl=suf==='2',pr=suf==="'",c=60/N,O=6,mid=Math.floor(N/2);let vert=2,lo=0,hi=N-1,dir='cw';
 if(L==='R'){vert=1;lo=N-n;hi=w?N-1:N-n;dir='up'}else if(L==='L'){vert=1;lo=w?0:n-1;hi=n-1;dir='down'}
 else if(L==='U'){vert=0;lo=w?0:n-1;hi=n-1;dir='left'}else if(L==='D'){vert=0;lo=N-n;hi=w?N-1:N-n;dir='right'}
 else if(L==='M'){vert=1;lo=hi=mid;dir='down'}else if(L==='E'){vert=0;lo=hi=mid;dir='right'}else if(L==='B')dir='ccw';
 if(pr)dir={up:'down',down:'up',left:'right',right:'left',cw:'ccw',ccw:'cw'}[dir];
 let s=`<svg viewBox="0 0 72 72" width="${px}" height="${px}" role="img" aria-label="${tok}">`;
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){const h=vert===2||(vert===1&&i>=lo&&i<=hi)||(vert===0&&j>=lo&&j<=hi);s+=`<rect x="${O+i*c}" y="${O+j*c}" width="${c}" height="${c}" fill="${h?'#ffcc33':'#9097b0'}" stroke="#222"/>`}
 const R='#ff2d2d',head=(x,y,dx,dy)=>{const l=Math.hypot(dx,dy);dx/=l;dy/=l;return`<polygon points="${x+dx*7},${y+dy*7} ${x-dy*4.5},${y+dx*4.5} ${x+dy*4.5},${y-dx*4.5}" fill="${R}"/>`},
 ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${R}" stroke-width="3" stroke-linecap="round"/>`+head(x2,y2,x2-x1,y2-y1);
 const offs=dbl?[-5,5]:[0];
 if(vert===1){const x=O+(lo+hi+1)/2*c;offs.forEach(o=>{s+=dir==='up'?ln(x+o,O+54,x+o,O+6):ln(x+o,O+6,x+o,O+54)})}
 else if(vert===0){const y=O+(lo+hi+1)/2*c;offs.forEach(o=>{s+=dir==='left'?ln(O+54,y+o,O+6,y+o):ln(O+6,y+o,O+54,y+o)})}
 else(dbl?[22,13]:[18]).forEach(r=>{const cw=dir==='cw',a0=(cw?-60:240)*Math.PI/180,a1=(cw?210:-30)*Math.PI/180,P=a=>[36+r*Math.cos(a),36+r*Math.sin(a)],p0=P(a0),p1=P(a1);
  s+=`<path d="M${p0[0]} ${p0[1]} A${r} ${r} 0 1 ${cw?1:0} ${p1[0]} ${p1[1]}" fill="none" stroke="${R}" stroke-width="3" stroke-linecap="round"/>`+(cw?head(p1[0],p1[1],-Math.sin(a1),Math.cos(a1)):head(p1[0],p1[1],Math.sin(a1),-Math.cos(a1)))});
 const lab=w?(n>2?n+'w':''):(n>1?''+n:'');
 if(lab){const tx=vert===1?O+(lo+hi+1)/2*c:vert===0?O+9:36,ty=vert===1?O+13:vert===0?O+(lo+hi+1)/2*c+5:40;s+=`<text x="${tx}" y="${ty}" text-anchor="middle" font-size="14" font-weight="700" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">${lab}</text>`}
 return s+'</svg>'}
function arcSvg(label,cw,px){const R='#ff2d2d',r=22,a0=(cw?-60:240)*Math.PI/180,a1=(cw?210:-30)*Math.PI/180,Pp=a=>[36+r*Math.cos(a),36+r*Math.sin(a)],p0=Pp(a0),p1=Pp(a1),
 dx=cw?-Math.sin(a1):Math.sin(a1),dy=cw?Math.cos(a1):-Math.cos(a1),l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,x=p1[0],y=p1[1];
 return `<svg viewBox="0 0 72 72" width="${px}" height="${px}" role="img" aria-label="${label}"><circle cx="36" cy="36" r="30" fill="#9097b0" stroke="#222"/><path d="M${p0[0]} ${p0[1]} A${r} ${r} 0 1 ${cw?1:0} ${p1[0]} ${p1[1]}" fill="none" stroke="${R}" stroke-width="3" stroke-linecap="round"/><polygon points="${x+ux*7},${y+uy*7} ${x-uy*4.5},${y+ux*4.5} ${x+uy*4.5},${y-ux*4.5}" fill="${R}"/><text x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#111" stroke="#fff" stroke-width="3" paint-order="stroke">${label}</text></svg>`}
function sname(mi,d){const b=P.btn.find(b=>b.m===mi&&b.d===d);if(b)return b.t;
 if(P.k[0]!=='c')return mname(mi,d);
 const N=P.moves.length/3,ax=(mi/N)|0,l=mi%N,lo=l<N/2,L=[['L','R'],['U','D'],['B','F']][ax][lo?0:1],dep=lo?l+1:N-l,fd=lo?-1:1;
 return (dep>1?dep:'')+L+(d===fd?'':"'")}
function mkSteps(sol){const out=[],cube=P.k[0]==='c';
 for(let i=0;i<sol.length;i++){let [mi,d]=sol[i],n=1;
  if(i+1<sol.length&&sol[i+1][0]===mi&&sol[i+1][1]===d){i++;n=2;if(P.k==='skw'||P.k==='pyr'){d=-d;n=1}}   // 3 tartibli burilishlarda 2×(+120°) = −120°
  const base=sname(mi,d);out.push({mi,d,n,t:n===2?(cube?base.replace("'",'')+'2':base+'×2'):base})}
 return out}
const FN={R:"o'ng",L:'chap',U:'tepa',D:'past',F:'old',B:'orqa'};
function descStep(s){
 if(P.k[0]!=='c'){const lw=s.t[0]===s.t[0].toLowerCase()&&P.k==='pyr',nm=P.k==='skw'?'Burchak':P.k==='pyr'?'Uch '+s.t[0].toUpperCase()+(lw?' (faqat uchi)':' (ikki qatlam)'):'Yoq '+s.t.replace(/[^0-9]/g,'');
  return nm+(P.k==='skw'?' '+s.t[0]:'')+" — "+(s.n===2?'2 marta ':'')+(s.d>0?"soat mili bo'yicha":'soat miliga teskari')+' buring (o\'sha uchga/yoqqa qarab).'}
 const m=/^(\d*)([UDLRFB])(2|')?$|^([MES])(2|')?$/.exec(s.t);if(!m)return'';
 const sf=m[3]||m[5],dir=sf==='2'?'180° (ikki marta)':sf==="'"?"90° soat miliga teskari":"90° soat mili bo'yicha";
 if(m[4])return{M:"O'rta (M) qatlam",E:'Ekvator (E) qatlam',S:'Standing (S) qatlam'}[m[4]]+' — '+dir+'.';
 return(m[1]?m[1]+'-qatlam: ':'')+FN[m[2]]+' yuza — '+dir+' (o\'sha yuzaga qarab).'}
function stepDiag(s){if(P.k[0]==='c'){const d=mDiag(s.t,P.moves.length/3,76);if(d)return d}return arcSvg(s.t,s.d>0,76)}
function openSteps(sol){document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pn').forEach(p=>p.style.display='none');STP={steps:mkSteps(sol),i:0,auto:false};$('stp').classList.add('on');renderStep()}
function closeSteps(){const was=!!STP||!!HL;if(STP)STP.auto=false;STP=null;HL=null;$('stp').classList.remove('on');if(was)draw()}
function renderStep(){const S=STP;if(!S)return;const n=S.steps.length,s=S.steps[S.i];
 HL=s?new Set(P.moves[s.mi].idx):null;
 $('sCnt').textContent=S.i+' / '+n;
 $('schips').innerHTML=S.steps.map((x,i)=>'<span class="c2'+(i<S.i?' done':i===S.i?' cur':'')+'">'+x.t+'</span>').join('');
 const c=$('schips').querySelector('.cur'),ch=$('schips');if(c)ch.scrollLeft=c.offsetLeft-ch.clientWidth/2+c.offsetWidth/2;
 $('sdg').innerHTML=s?stepDiag(s):'<div style="font-size:40px;width:76px;text-align:center">✓</div>';
 $('sinfo').innerHTML=s?'<b>'+(S.i+1)+'-qadam: '+s.t+'</b><br><small>'+descStep(s)+'</small>':'<b>Tugadi ✓</b><br><small>Kubik yechildi.</small>';
 $('sFirst').disabled=$('sPrev').disabled=S.i===0;$('sNext').disabled=!s;$('sAuto').disabled=!s;$('sAuto').textContent=S.auto?"⏸ To'xtat":'▶ Avto';
 draw()}
async function stFwd(S,dur){const s=S.steps[S.i];HL=null;for(let k=0;k<s.n;k++)await doMove(P.moves[s.mi],s.d,dur);if(STP===S){S.i++;renderStep()}}
